name: release-check

# CI-side enforcement of the read-only release gate (scripts/check-release.mjs),
# which runs the strict release-metadata checks (KIMI_HUD_RELEASE_CHECK=1) that
# were previously a manual, environment-variable-gated step.
#
# Triggers are limited to main, version tags, and pull requests on purpose:
# upstream/<version>-prep branches may legitimately carry pending-release
# compatibility notes until their release closes them (see AGENTS.md issue
# workflow). Only what can land on main or ship as a tag must pass the strict
# metadata check.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only: the gate never writes to the repository.
permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release metadata resolves version tags and merge-base ancestry.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Release gate (read-only)
        run: npm run check-release
