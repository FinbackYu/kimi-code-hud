name: test

on:
  push:
  pull_request:

# Read-only CI: no job needs write access to the repository.
permissions:
  contents: read

jobs:
  node-test:
    # Support tiers follow the Node.js release schedule
    # (https://nodejs.org/en/about/eol):
    # - Node 24 (Active LTS) is the recommended runtime and the only tier run
    #   on every supported OS (Linux, macOS, Windows).
    # - Node 22 (Maintenance LTS, security support through 2027-04) runs on a
    #   single OS; it catches Node-core regressions without tripling the
    #   matrix.
    # - Node 20 (EOL since 2026-04) and Node 18 (EOL since 2025-04) run as
    #   non-blocking best-effort jobs: package.json still declares ">=18", so
    #   accidental breakage of the declared floor must stay visible, but EOL
    #   runtimes must not gate merges. Removing them from CI later would not
    #   change the support contract either — the engines field and the support
    #   policy do that.
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - node: 22
            os: ubuntu-latest
          - node: 20
            os: ubuntu-latest
            experimental: true
          - node: 18
            os: ubuntu-latest
            experimental: true
    # Actions are pinned to full commit SHAs so a moved tag cannot swap the
    # executed code; Dependabot (.github/dependabot.yml) keeps the pins and
    # their version comments current.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Syntax check
        shell: bash
        run: |
          shopt -s nullglob
          for file in bin/*.mjs hooks/*.mjs src/*.mjs scripts/*.mjs; do
            node --check "$file"
          done
      - name: Empty-input smoke test
        shell: bash
        run: printf '' | node bin/kimi-hud.mjs
      - name: Shell quoting smoke test (spaces, CJK, shell metacharacters)
        # POSIX-only, and not just for the execution half: the sandboxed
        # KIMI_CODE_HOME/KIMI_HUD_HOME exported below are MSYS-style paths,
        # which node.exe on Windows would resolve against the current drive
        # root instead of the Git Bash /tmp the greps read back. Windows
        # install/uninstall behavior is covered by the node-spawned suites,
        # and command execution there stays with the honest probe in
        # test/command.test.mjs.
        if: runner.os != 'Windows'
        shell: bash
        # Exercises the generated statusLine command end to end: the CLI is
        # copied to a path that forces quoteCommandArg quoting, --install
        # persists it into an isolated tui.toml, and the exact persisted
        # string is executed through a real POSIX shell. Windows hosts run the
        # generated command with their own shell, whose semantics remain
        # unverified for this project (no local Windows), so the execution
        # half of this step is POSIX-only.
        run: |
          set -euo pipefail
          root="$(pwd)"
          base="$(mktemp -d)/hud 空格 & 'quote' \$dir"
          mkdir -p "$base/hud" "$base/kimi-code-home"
          cp -R "$root/bin" "$root/src" "$root/hooks" "$base/hud/"
          git init -q "$base"
          git -C "$base" -c user.name=hud-ci -c user.email=hud-ci@example.com commit -q --allow-empty -m smoke
          cd "$base"
          export KIMI_CODE_HOME="$base/kimi-code-home"
          export KIMI_HUD_HOME="$base/hud-home"
          script="$base/hud/bin/kimi-hud.mjs"

          node "$script" --install >/dev/null
          grep -q '^command = ' "$KIMI_CODE_HOME/tui.toml"

          generated="$(node -e '
            const fs = require("node:fs");
            const line = fs.readFileSync(process.argv[1], "utf8")
              .split("\n")
              .find((entry) => entry.startsWith("command = "));
            if (!line) process.exit(1);
            process.stdout.write(JSON.parse(line.slice("command = ".length)));
          ' "$KIMI_CODE_HOME/tui.toml")"
          printf '' | bash -c "$generated" >/dev/null

          printf '' | node "$script" >/dev/null
          node "$script" --uninstall >/dev/null
          if grep -q '^command = ' "$KIMI_CODE_HOME/tui.toml"; then
            echo "statusLine command survived --uninstall" >&2
            exit 1
          fi
      - name: Whitespace check
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            git diff --check "$before..HEAD"
          else
            echo "No usable base revision (new ref, tag, or rewritten history); skipping whitespace check."
          fi
